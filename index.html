<script>
/* ============================= FIREBASE INITIALIZATION ============================= */
const firebaseConfig = {
  apiKey: "AIzaSyBDaPLCjVH2eP3MopOW-9Y4DQmjz9-XG-o",
  authDomain: "accounting-system-6ebd3.firebaseapp.com",
  databaseURL: "https://accounting-system-6ebd3-default-rtdb.firebaseio.com",
  projectId: "accounting-system-6ebd3",
  storageBucket: "accounting-system-6ebd3.firebasestorage.app",
  messagingSenderId: "1001473839877",
  appId: "1:1001473839877:web:19d66367dfe7def9239d6c",
  measurementId: "G-2CY1SS6P8L"
};

// Initialize Firebase
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ============================= ERROR SAFETY NET ============================= */
window.addEventListener('error', function(e){
  const detail = (e && e.error && (e.error.stack || e.error.message)) || e.message || 'Unknown error';
  showFatalError(detail);
});
function showFatalError(detail){
  let box = document.getElementById('fatal-error-box');
  if(!box){
    box = document.createElement('div');
    box.id = 'fatal-error-box';
    box.style.cssText = 'position:fixed; bottom:0; left:0; right:0; background:#7d2c22; color:#fff; padding:12px 18px; font:12px monospace; z-index:9999; max-height:35vh; overflow:auto; white-space:pre-wrap;';
    document.body.appendChild(box);
  }
  box.textContent = 'Something went wrong: ' + detail;
}

/* ============================= STATE ============================= */
const STORAGE_KEY = 'ledger-state-v1';
let state = null;
let currentTab = 'dashboard';
let storageMode = 'localStorage'; // 'localStorage' | 'memory'

const DEFAULT_STATE = {
  currency: 'LE',
  accounts: [
    {code:'1000', name:'Cash', type:'asset', system:true},
    {code:'1100', name:'Accounts Receivable', type:'asset', system:true},
    {code:'1200', name:'Inventory', type:'asset', system:true},
    {code:'2000', name:'Accounts Payable', type:'liability', system:true},
    {code:'3000', name:"Owner's Capital", type:'equity', system:true},
    {code:'4000', name:'Sales Revenue', type:'revenue', system:true},
    {code:'4100', name:'Service Revenue', type:'revenue', system:true},
    {code:'5000', name:'Cost of Goods Sold', type:'expense', system:true},
    {code:'5100', name:'General & Admin Expenses', type:'expense', system:true},
  ],
  journal: [],
  journalsConfig: [
    {id:'J-0001', name:'Sales Journal', code:'SALES', type:'sale'},
    {id:'J-0002', name:'Purchase Journal', code:'PURCHASE', type:'purchase'},
    {id:'J-0003', name:'Cash', code:'CASH', type:'cash'},
    {id:'J-0004', name:'Bank', code:'BANK', type:'bank'},
    {id:'J-0005', name:'Miscellaneous Operations', code:'MISC', type:'general'},
  ],
  journalSeq: {}, // running per-journal, per-month sequence — see nextJournalSerial()
  currencies: [
    {code:'EGP', symbol:'LE', name:'Egyptian pound', rate:1, active:true, lastUpdate:null},
    {code:'EUR', symbol:'€', name:'Euro', rate:1, active:true, lastUpdate:null},
    {code:'SAR', symbol:'SR', name:'Saudi riyal', rate:1, active:true, lastUpdate:null},
  ],
  companyCurrencyCode: 'EGP',
  products: [],
  customers: [],
  suppliers: [],
  sales: [],
  purchases: [],
  posSessions: [],
  users: [],
  counters: {journal:0, product:0, customer:0, supplier:0, sale:0, purchase:0}
};

function newState(){ return JSON.parse(JSON.stringify(DEFAULT_STATE)); }

function loadState(){
  db.ref('ledger_state').on('value', (snapshot) => {
    const data = snapshot.val();
    if (data) {
      state = data;
    } else {
      state = newState();
      saveState();
    }

    storageMode = 'firebase';

    // حماية النظام في حالة كانت الحقول فارغة في Firebase
    if(!Array.isArray(state.journal)) state.journal = [];
    if(!Array.isArray(state.products)) state.products = [];
    if(!Array.isArray(state.accounts)) state.accounts = JSON.parse(JSON.stringify(DEFAULT_STATE.accounts || []));
    if(!Array.isArray(state.journalsConfig)) state.journalsConfig = JSON.parse(JSON.stringify(DEFAULT_STATE.journalsConfig || []));
    if(!Array.isArray(state.posSessions)) state.posSessions = [];
    if(!Array.isArray(state.users)) state.users = [];
    if(!Array.isArray(state.sales)) state.sales = [];
    if(!Array.isArray(state.purchases)) state.purchases = [];
    if(!Array.isArray(state.currencies)) state.currencies = JSON.parse(JSON.stringify(DEFAULT_STATE.currencies || []));
    if(!state.companyCurrencyCode) state.companyCurrencyCode = state.currencies[0] ? state.currencies[0].code : null;
    if(!state.journalSeq || typeof state.journalSeq!=='object') state.journalSeq = {};

    // recover opening inventory entry match
    if(Array.isArray(state.products)){
      state.products.forEach(p=>{
        if(p.kind==='product' && p.openingEntryId===undefined){
          const match = (state.journal || []).find(e=>e.source==='manual' && e.desc==='Opening inventory balance: '+p.name);
          p.openingEntryId = match ? match.id : null;
        }
      });
    }

    if(Array.isArray(state.accounts)) sortAccounts();

    // self-repair duplicate journal ids
    (function dedupeJournalIds(){
      const seen = new Set();
      if(Array.isArray(state.journalsConfig)){
        state.journalsConfig.forEach(j=>{
          if(seen.has(j.id)) j.id = nextJournalConfigId();
          seen.add(j.id);
        });
      }
    })();

    render();
  });
}
/* Generates a journal id that's guaranteed unique against whatever is currently
   in state.journalsConfig — deliberately NOT based on the shared uid() counter,
   since the five built-in journals ship with fixed ids (J-0001..J-0005) that the
   counter starts at zero, ready to collide with. */
function nextJournalConfigId(){
  let maxN = 0;
  (state.journalsConfig||[]).forEach(j=>{
    const m = /^J-(\d+)$/.exec(j.id||'');
    if(m) maxN = Math.max(maxN, parseInt(m[1],10));
  });
  return 'J-' + String(maxN+1).padStart(4,'0');
}

function saveState(){
  if(db && state){
    db.ref('ledger_state').set(state, (error) => {
      if(error){
        console.error('Firebase save error:', error);
      }
    });
  }
}
/* ============================= HELPERS ============================= */
function fmt(n){
  n = Number(n)||0;
  return n.toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__toastT);
  window.__toastT = setTimeout(()=>t.classList.remove('show'), 2200);
}
function uid(prefix, key){
  state.counters[key] = (state.counters[key]||0)+1;
  return prefix + '-' + String(state.counters[key]).padStart(4,'0');
}
function accountByCode(code){ return state.accounts.find(a=>a.code===code); }
function typeLabel(t){
  return {asset:'Asset', liability:'Liability', equity:'Equity', revenue:'Revenue', expense:'Expense'}[t]||t;
}

/* Each configured Journal (Configuration → Journals) has its own running serial,
   formatted CODE/YYYY/MM/#### and reset every month — e.g. the Cash journal's
   first entry in Jan 2026 is CASH/2026/01/0001, its first in Feb 2026 is
   CASH/2026/02/0001. Falls back to the plain JV-#### id if no journals exist. */
function defaultJournalForType(type){
  return state.journalsConfig.find(j=>j.type===type) || state.journalsConfig[0] || null;
}
function defaultJournalForSource(source){
  const typeMap = {sale:'sale', purchase:'purchase', receipt:'cash', payment:'cash', manual:'general', reversal:'general'};
  return defaultJournalForType(typeMap[source] || 'general');
}
function nextJournalSerial(journal, date){
  const d = new Date((date||todayISO())+'T00:00:00');
  const year = d.getFullYear();
  const month = String(d.getMonth()+1).padStart(2,'0');
  const key = journal.code+'-'+year+'-'+month;
  state.journalSeq[key] = (state.journalSeq[key]||0)+1;
  const serial = String(state.journalSeq[key]).padStart(4,'0');
  return `${journal.code}/${year}/${month}/${serial}`;
}

/* Post a balanced journal entry. lines: [{code, debit, credit, partyType, partyId}].
   journalId picks which configured Journal this posts through (and therefore whose
   serial it consumes) — if omitted, it's resolved automatically from `source`. */
function postEntry(date, desc, source, lines, journalId){
  const totalD = lines.reduce((s,l)=>s+(Number(l.debit)||0),0);
  const totalC = lines.reduce((s,l)=>s+(Number(l.credit)||0),0);
  if(Math.round(totalD*100) !== Math.round(totalC*100)){
    throw new Error('Entry is not balanced: debit does not equal credit');
  }
  const journal = (journalId && state.journalsConfig.find(j=>j.id===journalId)) || defaultJournalForSource(source);
  const ref = journal ? nextJournalSerial(journal, date) : uid('JV','journal');
  const entry = {
    id: ref,
    journalId: journal ? journal.id : null,
    date, desc, source,
    lines: lines.map(l=>({code:l.code, debit:Number(l.debit)||0, credit:Number(l.credit)||0, partyType:l.partyType||null, partyId:l.partyId||null})),
    reversed:false
  };
  state.journal.push(entry);
  return entry;
}

function accountTotals(code){
  let debit=0, credit=0;
  state.journal.forEach(e=>{
    e.lines.forEach(l=>{
      if(l.code===code){ debit+=l.debit; credit+=l.credit; }
    });
  });
  return {debit,credit};
}
function partyBalance(type, id){
  // customer: AR(1100) debit - credit ; supplier: AP(2000) credit - debit
  let debit=0, credit=0;
  state.journal.forEach(e=>{
    e.lines.forEach(l=>{
      if(l.partyType===type && l.partyId===id){ debit+=l.debit; credit+=l.credit; }
    });
  });
  return type==='customer' ? (debit-credit) : (credit-debit);
}
function addDays(dateStr, days){
  const d = new Date((dateStr||todayISO())+'T00:00:00');
  d.setDate(d.getDate()+Number(days||0));
  return d.toISOString().slice(0,10);
}
/* ---- Invoice aging (FIFO allocation of receipts/payments against invoices) ---- */
function invoicesForParty(partyType, partyId, asOfISO){
  const isCustomer = partyType==='customer';
  const entries = [];
  state.journal.forEach(e=>{
    if(e.reversed) return;
    if(asOfISO && e.date > asOfISO) return; // only applied when an explicit cutoff is requested
    e.lines.forEach(l=>{
      if(l.partyType===partyType && l.partyId===partyId) entries.push({e,l});
    });
  });
  entries.sort((a,b)=> a.e.date===b.e.date ? String(a.e.id).localeCompare(b.e.id) : a.e.date.localeCompare(b.e.date));
  const invoices = [];
  entries.forEach(({e,l})=>{
    const increase = isCustomer ? l.debit : l.credit;
    const decrease = isCustomer ? l.credit : l.debit;
    if(increase>0){
      invoices.push({entryId:e.id, date:e.date, dueDate:e.dueDate||e.date, amount:increase, remaining:increase});
    }
    if(decrease>0){
      let amt = decrease;
      for(const inv of invoices){
        if(amt<=0.004) break;
        if(inv.remaining<=0.004) continue;
        const applied = Math.min(inv.remaining, amt);
        inv.remaining -= applied; amt -= applied;
      }
    }
  });
  return invoices.filter(inv=>inv.remaining>0.004);
}
function agingBucket(dueDate, asOfISO){
  const due = new Date((dueDate||todayISO())+'T00:00:00');
  const asOf = new Date((asOfISO||todayISO())+'T00:00:00');
  const days = Math.floor((asOf-due)/86400000);
  if(days<=0) return 'current';
  if(days<=30) return 'b1';
  if(days<=60) return 'b2';
  if(days<=90) return 'b3';
  return 'b4';
}
/* Per-invoice breakdown across a set of parties — this is the source of truth for
   the aging buckets AND lets the UI show the overdue amount at the individual-invoice
   level (which invoice, whose it is, and how many days overdue) instead of only a
   lump total. Pass asOfISO to get a historical snapshot (e.g. for the Dashboard's
   date-range filter); omit it to use today, exactly as before. */
function invoiceRowsForParties(partyType, parties, asOfISO){
  const asOf = asOfISO || todayISO();
  const asOfDate = new Date(asOf+'T00:00:00');
  const rows = [];
  parties.forEach(p=>{
    invoicesForParty(partyType, p.id, asOfISO).forEach(inv=>{
      const dueDate = inv.dueDate || asOf;
      const daysOverdue = Math.max(0, Math.floor((asOfDate - new Date(dueDate+'T00:00:00'))/86400000));
      rows.push({
        partyName: p.name,
        entryId: inv.entryId,
        date: inv.date,
        dueDate,
        remaining: inv.remaining,
        bucket: agingBucket(dueDate, asOf),
        daysOverdue
      });
    });
  });
  rows.sort((a,b)=> b.daysOverdue - a.daysOverdue || a.dueDate.localeCompare(b.dueDate));
  return rows;
}
function agingForParties(partyType, parties, asOfISO){
  const rows = invoiceRowsForParties(partyType, parties, asOfISO);
  const buckets = {current:0,b1:0,b2:0,b3:0,b4:0};
  let total = 0;
  rows.forEach(r=>{ buckets[r.bucket] += r.remaining; total += r.remaining; });
  const overdueTotal = buckets.b1+buckets.b2+buckets.b3+buckets.b4;
  return {buckets, total, overdueTotal, rows};
}
function unpaidInvoicesAging(asOfISO){ return agingForParties('customer', state.customers, asOfISO); }
function unpaidBillsAging(asOfISO){ return agingForParties('supplier', state.suppliers, asOfISO); }
function cashBalance(){ const t = accountTotals('1000'); return t.debit - t.credit; }
function inventoryValue(){
  return state.products.filter(p=>p.kind==='product').reduce((s,p)=>s+p.qty*p.cost,0);
}
function totalRevenue(){
  const t1=accountTotals('4000'), t2=accountTotals('4100');
  return (t1.credit-t1.debit)+(t2.credit-t2.debit);
}
function totalCOGS(){ const t=accountTotals('5000'); return t.debit-t.credit; }
function totalExpenses(){ const t=accountTotals('5100'); return t.debit-t.credit; }
function netProfit(){ return totalRevenue()-totalCOGS()-totalExpenses(); }

/* ---- Dashboard date-range filter (Odoo-style) ----
   Everything on the Dashboard — balances, revenue/expense flows, receivables/
   payables aging, and the trend charts — is computed relative to a selected
   [dashRangeStart, dashRangeEnd] window instead of hardcoded "today"/"this
   month". Comparison ("previous period") automatically matches the selected
   granularity: a day compares to the day before, a week to the week before,
   a month to the month before, and so on; a custom range compares to the
   same-length period immediately before it. */
let dashRangePreset = 'this_month';
let dashRangeStart = null;
let dashRangeEnd = null;
let dashRangeOpen = false;
const DASH_RANGE_PRESETS = [
  {key:'today', label:'Today'},
  {key:'yesterday', label:'Yesterday'},
  {key:'this_week', label:'This Week'},
  {key:'last_week', label:'Last Week'},
  {key:'this_month', label:'This Month'},
  {key:'last_month', label:'Last Month'},
  {key:'this_quarter', label:'This Quarter'},
  {key:'last_quarter', label:'Last Quarter'},
  {key:'this_year', label:'This Year'},
  {key:'last_year', label:'Last Year'},
];
function pad2(n){ return String(n).padStart(2,'0'); }
function dateToISO(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function isoToDate(s){ return new Date(s+'T00:00:00'); }
function addDaysToDate(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function startOfWeekDate(d){ const r=new Date(d); const day=r.getDay(); r.setDate(r.getDate()+(day===0?-6:1-day)); return r; } // Monday-start
function startOfMonthDate(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function endOfMonthDate(d){ return new Date(d.getFullYear(), d.getMonth()+1, 0); }
function startOfQuarterDate(d){ const q=Math.floor(d.getMonth()/3); return new Date(d.getFullYear(), q*3, 1); }
function endOfQuarterDate(d){ const q=Math.floor(d.getMonth()/3); return new Date(d.getFullYear(), q*3+3, 0); }
function startOfYearDate(d){ return new Date(d.getFullYear(),0,1); }
function endOfYearDate(d){ return new Date(d.getFullYear(),11,31); }
function dashPresetRange(preset){
  const today = isoToDate(todayISO());
  let s,e;
  switch(preset){
    case 'today': s=today; e=today; break;
    case 'yesterday': s=addDaysToDate(today,-1); e=s; break;
    case 'this_week': s=startOfWeekDate(today); e=addDaysToDate(s,6); break;
    case 'last_week': s=addDaysToDate(startOfWeekDate(today),-7); e=addDaysToDate(s,6); break;
    case 'this_month': s=startOfMonthDate(today); e=endOfMonthDate(today); break;
    case 'last_month': { const m=new Date(today.getFullYear(),today.getMonth()-1,1); s=startOfMonthDate(m); e=endOfMonthDate(m); break; }
    case 'this_quarter': s=startOfQuarterDate(today); e=endOfQuarterDate(today); break;
    case 'last_quarter': { const q=new Date(today.getFullYear(),today.getMonth()-3,1); s=startOfQuarterDate(q); e=endOfQuarterDate(q); break; }
    case 'this_year': s=startOfYearDate(today); e=endOfYearDate(today); break;
    case 'last_year': { const y=new Date(today.getFullYear()-1,0,1); s=startOfYearDate(y); e=endOfYearDate(y); break; }
    default: s=startOfMonthDate(today); e=endOfMonthDate(today);
  }
  return [dateToISO(s), dateToISO(e)];
}
function dashPreviousRange(preset, startISO, endISO){
  const start = isoToDate(startISO), end = isoToDate(endISO);
  let s,e;
  switch(preset){
    case 'today': case 'yesterday': s=addDaysToDate(start,-1); e=s; break;
    case 'this_week': case 'last_week': s=addDaysToDate(start,-7); e=addDaysToDate(end,-7); break;
    case 'this_month': case 'last_month': { const m=new Date(start.getFullYear(),start.getMonth()-1,1); s=startOfMonthDate(m); e=endOfMonthDate(m); break; }
    case 'this_quarter': case 'last_quarter': { const q=new Date(start.getFullYear(),start.getMonth()-3,1); s=startOfQuarterDate(q); e=endOfQuarterDate(q); break; }
    case 'this_year': case 'last_year': { const y=new Date(start.getFullYear()-1,0,1); s=startOfYearDate(y); e=endOfYearDate(y); break; }
    default: { // custom range: same-length period immediately before
      const lengthDays = Math.round((end-start)/86400000)+1;
      e = addDaysToDate(start,-1);
      s = addDaysToDate(e, -(lengthDays-1));
    }
  }
  return [dateToISO(s), dateToISO(e)];
}
function ensureDashRangeInit(){
  if(!dashRangeStart || !dashRangeEnd){
    const [s,e] = dashPresetRange(dashRangePreset);
    dashRangeStart = s; dashRangeEnd = e;
  }
}
function toggleDashRangeMenu(){ dashRangeOpen = !dashRangeOpen; render(); }
function selectDashRangePreset(preset){
  dashRangePreset = preset;
  const [s,e] = dashPresetRange(preset);
  dashRangeStart = s; dashRangeEnd = e;
  dashRangeOpen = false;
  render();
}
function applyDashCustomRange(){
  const s = document.getElementById('dash-range-start').value;
  const e = document.getElementById('dash-range-end').value;
  if(!s || !e){ toast('Please choose both a start and end date'); return; }
  if(s>e){ toast('The start date must be before the end date'); return; }
  dashRangeStart = s; dashRangeEnd = e; dashRangePreset = 'custom';
  dashRangeOpen = false;
  render();
}
function formatDateDisplay(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${m}/${d}/${y}`;
}
function dashRangeButtonLabel(){
  const preset = DASH_RANGE_PRESETS.find(p=>p.key===dashRangePreset);
  if(preset) return preset.label;
  return formatDateDisplay(dashRangeStart)+' – '+formatDateDisplay(dashRangeEnd);
}
function renderDashRangePicker(){
  ensureDashRangeInit();
  return `
  <div style="position:relative; display:inline-block;">
    <button class="secondary" style="display:flex; align-items:center; gap:8px;" onclick="toggleDashRangeMenu()">
      📅 ${dashRangeButtonLabel()} <span style="font-size:11px;">▾</span>
    </button>
    ${dashRangeOpen?`
    <div style="position:absolute; top:calc(100% + 6px); right:0; z-index:50; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); display:flex; min-width:480px;">
      <div style="width:150px; border-right:1px solid var(--line); padding:8px 0; flex-shrink:0;">
        ${DASH_RANGE_PRESETS.map(p=>`
          <div style="padding:10px 16px; cursor:pointer; font-size:14px; ${dashRangePreset===p.key?'color:var(--azure); font-weight:700;':'color:var(--ink);'}" onclick="selectDashRangePreset('${p.key}')">${p.label}</div>
        `).join('')}
      </div>
      <div style="flex:1; padding:16px;">
        <div class="hint" style="margin-top:0; margin-bottom:10px;">Or pick a custom range:</div>
        <div style="display:flex; gap:10px; margin-bottom:14px;">
          <input type="date" id="dash-range-start" value="${dashRangeStart}" style="flex:1;">
          <input type="date" id="dash-range-end" value="${dashRangeEnd}" style="flex:1;">
        </div>
        <div style="display:flex; justify-content:flex-end;">
          <button onclick="applyDashCustomRange()">Apply</button>
        </div>
      </div>
    </div>`:''}
  </div>`;
}

/* ---- Range-based figures (flow items: activity WITHIN the range; balance-sheet
   items: balance AS OF the range's end date) ---- */
function accountTotalsForRange(code, startISO, endISO){
  let debit=0, credit=0;
  state.journal.forEach(e=>{
    if(e.date<startISO || e.date>endISO) return;
    e.lines.forEach(l=>{ if(l.code===code){ debit+=l.debit; credit+=l.credit; } });
  });
  return {debit,credit};
}
function revenueForRange(startISO,endISO){
  const s=accountTotalsForRange('4000',startISO,endISO), sv=accountTotalsForRange('4100',startISO,endISO);
  const sales=s.credit-s.debit, service=sv.credit-sv.debit;
  return {sales, service, total: sales+service};
}
function cogsExpensesForRange(startISO,endISO){
  const c=accountTotalsForRange('5000',startISO,endISO), e=accountTotalsForRange('5100',startISO,endISO);
  return (c.debit-c.credit)+(e.debit-e.credit);
}
function netProfitForRange(startISO,endISO){ return revenueForRange(startISO,endISO).total - cogsExpensesForRange(startISO,endISO); }
function accountBalanceAsOfDate(code, asOfISO){
  let debit=0, credit=0;
  state.journal.forEach(e=>{
    if(e.date > asOfISO) return;
    e.lines.forEach(l=>{ if(l.code===code){ debit+=l.debit; credit+=l.credit; } });
  });
  return {debit,credit};
}
function cashBalanceAsOfDate(asOfISO){ const t=accountBalanceAsOfDate('1000',asOfISO); return t.debit-t.credit; }
function inventoryValueAsOfDate(asOfISO){ const t=accountBalanceAsOfDate('1200',asOfISO); return t.debit-t.credit; }

/* ---- Monthly series for the trend charts, spanning only the months that
   overlap the selected range (each month clipped to the range's edges) ---- */
function monthLabel(ym){
  const [y,m] = ym.split('-').map(Number);
  return new Date(y,m-1,1).toLocaleDateString('en-US',{month:'short', year:'2-digit'});
}
function monthsBetween(startISO, endISO){
  const start = isoToDate(startISO), end = isoToDate(endISO);
  const months = [];
  let cur = new Date(start.getFullYear(), start.getMonth(), 1);
  const last = new Date(end.getFullYear(), end.getMonth(), 1);
  while(cur <= last){
    months.push(cur.getFullYear()+'-'+pad2(cur.getMonth()+1));
    cur = new Date(cur.getFullYear(), cur.getMonth()+1, 1);
  }
  return months;
}
function chartSeriesForRange(startISO, endISO){
  return monthsBetween(startISO, endISO).map(ym=>{
    const [y,m] = ym.split('-').map(Number);
    const mStart = dateToISO(new Date(y, m-1, 1)), mEnd = dateToISO(new Date(y, m, 0));
    const clipStart = mStart < startISO ? startISO : mStart;
    const clipEnd = mEnd > endISO ? endISO : mEnd;
    const rev = revenueForRange(clipStart, clipEnd);
    const c = accountTotalsForRange('5000', clipStart, clipEnd);
    const e = accountTotalsForRange('5100', clipStart, clipEnd);
    return {ym, sales:rev.sales, service:rev.service, total:rev.total, cogs:c.debit-c.credit, expenses:e.debit-e.credit};
  });
}
function pctChange(curr, prev){
  curr = Number(curr)||0; prev = Number(prev)||0;
  if(Math.abs(prev) < 0.005) return curr===0 ? 0 : null; // null = no prior baseline
  return ((curr-prev)/Math.abs(prev))*100;
}
function trendArrowHtml(pct){
  if(pct===null) return '<span class="trend flat">— n/a</span>';
  if(Math.abs(pct) < 0.05) return '<span class="trend flat">→ 0.0%</span>';
  const up = pct>0;
  return `<span class="trend ${up?'up':'down'}">${up?'▲':'▼'} ${up?'+':''}${pct.toFixed(1)}%</span>`;
}
function renderLineChartSVG(categories, series){
  const w=640, h=220, padL=8, padR=8, padT=26, padB=26;
  const chartW=w-padL-padR, chartH=h-padT-padB;
  const maxVal = Math.max(1, ...series.flatMap(s=>s.values));
  const n = categories.length;
  const stepX = n>1 ? chartW/(n-1) : 0;
  const pointsFor = values => values.map((v,i)=>{
    const x = padL + stepX*i;
    const y = padT + chartH - (v/maxVal)*chartH;
    return {x,y,v};
  });
  const linesSvg = series.map(s=>{
    const pts = pointsFor(s.values);
    const path = pts.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
    const dots = pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="${s.color}" stroke="#fff" stroke-width="1"></circle>`).join('');
    const labels = pts.map(p=>`<text x="${p.x.toFixed(1)}" y="${(p.y-9).toFixed(1)}" text-anchor="middle" font-size="10" fill="#152925" font-family="IBM Plex Mono,monospace">${fmt(p.v)}</text>`).join('');
    return `<path d="${path}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></path>${dots}${labels}`;
  }).join('');
  const xLabels = categories.map((c,i)=>{
    const x = padL + stepX*i;
    return `<text x="${x.toFixed(1)}" y="${(padT+chartH+18).toFixed(1)}" text-anchor="middle" font-size="10" fill="#5B655F" font-family="Inter,sans-serif">${c}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; display:block; overflow:visible;">
    <line x1="${padL}" y1="${padT+chartH}" x2="${w-padR}" y2="${padT+chartH}" stroke="#152925" stroke-width="1"></line>
    ${linesSvg}
    ${xLabels}
  </svg>`;
}
function renderRevenueChartSVG(series){
  const categories = series.map(r=>monthLabel(r.ym));
  return renderLineChartSVG(categories, [
    {color:'var(--credit)', values: series.map(r=>r.sales)},
    {color:'var(--azure)', values: series.map(r=>r.service)}
  ]);
}
function renderCogsExpensesChartSVG(series){
  const categories = series.map(r=>monthLabel(r.ym));
  return renderLineChartSVG(categories, [
    {color:'var(--debit)', values: series.map(r=>r.cogs)},
    {color:'var(--amber)', values: series.map(r=>r.expenses)}
  ]);
}

    if(el) el.style.display = 'none';
    if(titleEl) titleEl.style.display = 'none';
    return;
  }
  if(el) el.style.display = '';
  if(titleEl) titleEl.style.display = '';
  if(!el) return;
  const list = currentTopNavList();
  // The app-name badge (grid icon + "Accounting"/"Settings") always leads the bar,
  // before the Dashboard/Customers/... items — it names whichever sidebar icon
  // was clicked to get here, the same way Odoo's app switcher does.
  const appLabel = activeSuite==='settings' ? 'Settings' : 'Accounting';
  const appIcon = `<svg width="16" height="16" viewBox="0 0 14 14" fill="currentColor"><circle cx="2" cy="2" r="1.3"/><circle cx="7" cy="2" r="1.3"/><circle cx="12" cy="2" r="1.3"/><circle cx="2" cy="7" r="1.3"/><circle cx="7" cy="7" r="1.3"/><circle cx="12" cy="7" r="1.3"/><circle cx="2" cy="12" r="1.3"/><circle cx="7" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/></svg>`;
  el.innerHTML = `<div class="topnav-app" onclick="goToAppHome()"><span class="topnav-app-icon">${appIcon}</span><span>${appLabel}</span></div>` +
    list.map(t=>{
    if(t.children){
      return `<div class="topnav-item has-dropdown ${topNavActive===t.id?'active':''}" data-nav-id="${t.id}" onclick="toggleDropdown(event, '${t.id}')">${t.label}</div>`;
    }
    return `<div class="topnav-item ${topNavActive===t.id?'active':''}" onclick="goToTop('${t.id}')">${t.label}</div>`;
  }).join('');
  if(titleEl){
    const parent = list.find(t=>t.id===topNavActive);
    let label = '';
    if(parent){
      if(parent.children){
        const child = parent.children.find(c=>c.id===currentTab);
        label = child ? child.label : parent.label;
      } else {
        label = parent.label;
      }
    }
    titleEl.textContent = label;
  }
  // The open dropdown lives in a body-level portal (see toggleDropdown) so it's
  // never clipped by the topnav's own horizontal scroll/drag container.
  const portal = document.getElementById('topnav-dropdown-portal');
  if(portal && !openDropdownId) portal.style.display = 'none';
}
// Dropdowns render into this single body-level element instead of nesting inside
// .topnav-item, so the topnav can safely use overflow-x:auto (for drag-to-scroll)
// without its overflow box clipping the dropdown underneath.
function toggleDropdown(e, id){
  if(topnavDrag.moved) return;
  if(e) e.stopPropagation();
  const portal = document.getElementById('topnav-dropdown-portal');
  if(!portal) return;
  if(openDropdownId === id){
    openDropdownId = null;
    portal.style.display = 'none';
    return;
  }
  const t = currentTopNavList().find(x=>x.id===id);
  if(!t || !t.children) return;
  openDropdownId = id;
  portal.innerHTML = dropdownContentHTML(t);
  const trigger = (e && e.currentTarget) || document.querySelector(`[data-nav-id="${id}"]`);
  const rect = trigger.getBoundingClientRect();
  portal.style.left = Math.round(rect.left) + 'px';
  portal.style.top = Math.round(rect.bottom) + 'px';
  portal.style.display = 'block';
}
function goToDropdownChild(parentId, childId){
  openDropdownId = null;
  const portal = document.getElementById('topnav-dropdown-portal');
  if(portal) portal.style.display = 'none';
  showTopNav = true;
  activeSuite = 'accounting';
  topNavActive = parentId;
  currentTab = childId;
  render();
}
function closeDropdown(){
  if(openDropdownId){
    openDropdownId = null;
    const portal = document.getElementById('topnav-dropdown-portal');
    if(portal) portal.style.display = 'none';
  }
}
document.addEventListener('click', closeDropdown);
function goToTop(id){
  if(topnavDrag.moved) return;
  const t = currentTopNavList().find(x=>x.id===id);
  if(!t || t.children) return;
  closeDropdown();
  showTopNav = true;
  topNavActive = id;
  currentTab = t.target;
  render();
}
/* Clicking the app-name badge (the grid icon + "Accounting"/"Settings" label at
   the very start of the top bar) jumps back to that app's home page, the same
   way clicking an app name works in Odoo. */
function goToAppHome(){
  if(topnavDrag.moved) return;
  goTo((activeSuite==='settings' ? 'settings' : 'accounting') + '-suite');
}
function goTo(tab){
  closeDropdown();
  if(tab === 'accounting-suite'){
    // Entering the Accounting app: always land on its own Dashboard (the
    // Journal-cards one, not the sidebar's Business Overview), and show its topnav.
    showTopNav = true;
    activeSuite = 'accounting';
    currentTab = 'acct-dashboard';
    topNavActive = 'dashboard';
    render();
    return;
  }
  if(tab === 'settings-suite'){
    // Entering the Settings app: show its (simpler) top navbar, keeping whichever
    // settings-zone page you were last on, or defaulting to General Settings.
    showTopNav = true;
    activeSuite = 'settings';
    if(!SETTINGS_ZONE_TABS.includes(currentTab)) currentTab = 'backup';
    topNavActive = currentTab === 'users' ? 'users' : 'general';
    render();
    return;
  }
  showTopNav = false;
  currentTab = tab;
  render();
}

/* ---- Click-and-drag horizontal panning for the top navbar ---- */
let topnavDrag = {active:false, moved:false, startX:0, scrollLeft:0};
function topnavMouseDown(e){
  const el = document.getElementById('topnav');
  if(!el) return;
  topnavDrag.active = true;
  topnavDrag.moved = false;
  topnavDrag.startX = e.pageX;
  topnavDrag.scrollLeft = el.scrollLeft;
  el.classList.add('dragging');
}
function topnavMouseMove(e){
  if(!topnavDrag.active) return;
  const dx = e.pageX - topnavDrag.startX;
  if(Math.abs(dx) > 4 && !topnavDrag.moved){
    topnavDrag.moved = true;
    closeDropdown();
  }
  if(topnavDrag.moved){
    e.preventDefault();
    const el = document.getElementById('topnav');
    if(el) el.scrollLeft = topnavDrag.scrollLeft - dx;
  }
}
function topnavMouseUp(){
  const el = document.getElementById('topnav');
  if(el) el.classList.remove('dragging');
  topnavDrag.active = false;
  // Defer clearing "moved" so the click event that follows mouseup still sees it
  // and skips navigation — a drag shouldn't also trigger the tab underneath it.
  setTimeout(()=>{ topnavDrag.moved = false; }, 0);
}
document.addEventListener('mousemove', topnavMouseMove);
document.addEventListener('mouseup', topnavMouseUp);

/* ============================= RENDER ROUTER ============================= */
function render(){
  try{
    renderNav();
    renderTopNav();
    const v = document.getElementById('view');
    const renderers = {
      dashboard: renderDashboard, 'acct-dashboard': renderAccountingDashboard, 'journal-lines': renderJournalLines,
      'entry-detail': renderEntryDetail,
      accounts: renderAccounts, journal: renderJournal,
      journals: renderJournalsConfig, currencies: renderCurrencies,
      inventory: renderInventory, sales: renderSales, purchase: renderPurchase,
      receipts: renderReceipts, customers: renderCustomers, suppliers: renderSuppliers,
      trial: renderTrial, backup: renderBackup, pos: renderPOS, users: renderUsers,
      balance_sheet: renderBalanceSheet, profit_loss: renderProfitLoss, cash_flow: renderCashFlow,
      exec_summary: renderExecutiveSummary, tax_report: renderTaxReport, general_ledger: renderGeneralLedger,
      journal_report: renderJournalReport, partner_ledger: renderPartnerLedger,
      aged_receivable: renderAgedReceivable, aged_payable: renderAgedPayable
    };
    v.innerHTML = (storageMode==='memory' ? memoryBanner() : '') + renderers[currentTab]();
  }catch(err){
    showFatalError(err.stack || err.message);
  }
}
function memoryBanner(){
  return `<div class="banner error">⚠ This browser is blocking on-device storage right now, so changes will only last for this session. Use Backup &amp; Export → Download Backup often, and see the note there for how to keep data saved automatically.</div>`;
}

/* ============================= DASHBOARD ============================= */
/* Standalone sidebar "Dashboard" — the overall business snapshot (Cash, revenue,
   receivables/payables, trend charts). This is intentionally separate from the
   Accounting app's own Dashboard (see renderAccountingDashboard below), which is
   Journal-cards-only, Odoo-style. */
function renderDashboard(){
  ensureDashRangeInit();
  const start = dashRangeStart, end = dashRangeEnd;
  const [prevStart, prevEnd] = dashPreviousRange(dashRangePreset, start, end);

  // balance-sheet items: compare balance as of the range's end date vs as of the previous period's end date
  const cashCur = cashBalanceAsOfDate(end), cashPrev = cashBalanceAsOfDate(prevEnd);
  const invCur = inventoryValueAsOfDate(end), invPrev = inventoryValueAsOfDate(prevEnd);

  // flow items: activity within the selected range vs the previous period
  const revCur = revenueForRange(start,end).total, revPrev = revenueForRange(prevStart,prevEnd).total;
  const costCur = cogsExpensesForRange(start,end), costPrev = cogsExpensesForRange(prevStart,prevEnd);
  const npCur = netProfitForRange(start,end), npPrev = netProfitForRange(prevStart,prevEnd);

  const series = chartSeriesForRange(start,end);
  const rangeLabel = formatDateDisplay(start)+' – '+formatDateDisplay(end);

  // receivables/payables: snapshot AS OF the range's end date, so "current" vs
  // "overdue" is judged relative to that date, not necessarily today
  const agingAR = unpaidInvoicesAging(end);
  const agingAP = unpaidBillsAging(end);

  return `
    <div style="background:#232B3B; margin:-26px -32px 0; padding:0 32px; height:44px; display:flex; align-items:center;">
      <div class="topnav-item active" style="cursor:default; font-size:15px;">Dashboard</div>
    </div>
    <div style="background:var(--paper); margin:0 -32px 24px; padding:11px 32px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;">
      <div style="color:var(--text-soft); font-family:'Inter',sans-serif; font-size:15px; font-weight:700;">Dashboard</div>
      ${renderDashRangePicker()}
    </div>
    <div class="grid g2">
      ${statCard('', 'Cash Balance', fmt(cashCur), pctChange(cashCur,cashPrev))}
      ${statCard('amber', 'Inventory Value', fmt(invCur), pctChange(invCur,invPrev))}
    </div>
    <div class="grid g3">
      ${statCard('credit', 'Total Revenue', fmt(revCur), pctChange(revCur,revPrev))}
      ${statCard('debit', 'COGS + Expenses', fmt(costCur), pctChange(costCur,costPrev))}
      ${statCard(npCur>=0?'credit':'debit', 'Estimated Net Profit', fmt(npCur), pctChange(npCur,npPrev))}
    </div>
    <div class="grid g2">
      ${receivablePayableCard('ar', 'Total Receivables', 'Total unpaid invoices', agingAR, 'customer')}
      ${receivablePayableCard('ap', 'Total Payables', 'Total unpaid bills', agingAP, 'supplier')}
    </div>
    <div class="grid g2">
      <div class="card">
        <h3>Sales Trend (${rangeLabel})</h3>
        <div style="display:flex; gap:16px; font-size:12px; color:var(--text-soft); margin-bottom:10px;">
          <span><span style="display:inline-block;width:10px;height:10px;background:var(--credit);border-radius:2px;margin-right:5px; vertical-align:middle;"></span>Sales Revenue</span>
          <span><span style="display:inline-block;width:10px;height:10px;background:var(--azure);border-radius:2px;margin-right:5px; vertical-align:middle;"></span>Service Revenue</span>
        </div>
        ${series.every(r=>r.total===0) ? '<div class="empty">No revenue posted in this period</div>' : renderRevenueChartSVG(series)}
      </div>
      <div class="card">
        <h3>COGS &amp; Expenses Trend (${rangeLabel})</h3>
        <div style="display:flex; gap:16px; font-size:12px; color:var(--text-soft); margin-bottom:10px;">
          <span><span style="display:inline-block;width:10px;height:10px;background:var(--debit);border-radius:2px;margin-right:5px; vertical-align:middle;"></span>COGS</span>
          <span><span style="display:inline-block;width:10px;height:10px;background:var(--amber);border-radius:2px;margin-right:5px; vertical-align:middle;"></span>Expenses</span>
        </div>
        ${series.every(r=>r.cogs===0 && r.expenses===0) ? '<div class="empty">No COGS or expenses posted in this period</div>' : renderCogsExpensesChartSVG(series)}
      </div>
    </div>
  `;
}
/* The Accounting app's own Dashboard (reached via the Accounting sidebar icon,

/* ---- Journal cards (Odoo-style): one per configured Journal, showing this

/* ---- Journal Items: a flat, line-by-line view of one journal's postings.

/* Card showing a receivables/payables title (no amount/trend) with a nested
   unpaid-invoices/bills aging summary (Current / Overdue). Clicking "Overdue"
   drops down a vertical list of the four age buckets (Odoo-style); clicking one
   of those buckets then shows the history of invoices/bills that make it up. */
const AGING_BUCKET_DEFS = [
  {key:'b1', label:'1–30 days'},
  {key:'b2', label:'31–60 days'},
  {key:'b3', label:'61–90 days'},
  {key:'b4', label:'Above 90 days'},
];
let agingOverdueOpen = {};   // { [cardKey]: true|false } — whether the bucket dropdown is shown
let agingOpenBucket = {};    // { [cardKey]: bucketKey|null } — which bucket's history is expanded
let agingCurrentOpen = {};   // { [cardKey]: true|false } — whether the "Current" history is shown
function receivablePayableCard(key, mainLabel, unpaidLabel, aging, partyType){
  const partyLabel = partyType==='supplier' ? 'Supplier' : 'Customer';
  const currentOpen = !!agingCurrentOpen[key];
  const overdueOpen = !!agingOverdueOpen[key];
  const openBucket = agingOpenBucket[key] || null;
  const currentRows = (aging.rows||[]).filter(r=>r.bucket==='current');
  return `
  <div class="card">
    <h3>${mainLabel}</h3>
    <div style="border-top:1px dashed var(--line); margin-top:14px; padding-top:14px;">
      <div style="display:flex; justify-content:space-between; align-items:baseline; font-weight:700; color:var(--ink); margin-bottom:14px;">
        <span>${unpaidLabel}</span>
        <span class="mono">${state.currency}${fmt(aging.total)}</span>
      </div>
      <div class="grid g2">
        <div class="stat" style="cursor:pointer;" onclick="toggleAgingCurrent('${key}')">
          <div class="label" style="display:flex; justify-content:space-between; align-items:center;">
            <span>Current</span><span class="mono" style="color:var(--text-soft); font-size:13px;">${currentOpen?'▴':'▾'}</span>
          </div>
          <div class="value">${state.currency}${fmt(aging.buckets.current)}</div>
        </div>
        <div class="stat" style="cursor:pointer;" onclick="toggleAgingOverdue('${key}')">
          <div class="label" style="display:flex; justify-content:space-between; align-items:center;">
            <span style="color:var(--debit); text-transform:uppercase; letter-spacing:.4px; font-weight:800;">Overdue</span>
            <span class="mono" style="color:var(--text-soft); font-size:13px;">${overdueOpen?'▴':'▾'}</span>
          </div>
          <div class="value">${state.currency}${fmt(aging.overdueTotal)}</div>
        </div>
      </div>
      ${currentOpen?`
      <div style="margin-top:10px; border:1px solid var(--line); border-radius:10px; overflow:hidden; box-shadow:var(--shadow); padding:14px 16px;">
        ${currentRows.length===0?'<div class="empty">Nothing current right now</div>':
        `<table><thead><tr><th>${partyLabel}</th><th>Entry</th><th>Invoice Date</th><th>Due Date</th><th class="num">Amount</th></tr></thead><tbody>
        ${currentRows.map(r=>`<tr style="cursor:pointer;" onclick="goToEntryDetail('${r.entryId}')"><td>${r.partyName}</td><td class="mono">${r.entryId}</td><td>${r.date}</td><td>${r.dueDate}</td><td class="num">${state.currency}${fmt(r.remaining)}</td></tr>`).join('')}
        </tbody></table>`}
      </div>`:''}
      ${overdueOpen?`
      <div style="margin-top:10px; border:1px solid var(--line); border-radius:10px; overflow:hidden; box-shadow:var(--shadow);">
        ${AGING_BUCKET_DEFS.map((b,i)=>{
          const amount = aging.buckets[b.key];
          const bucketOpen = openBucket===b.key;
          const bucketRows = (aging.rows||[]).filter(r=>r.bucket===b.key);
          return `
          <div style="${i>0?'border-top:1px solid var(--line);':''}">
            <div style="display:flex; justify-content:space-between; align-items:center; padding:13px 16px; cursor:pointer; background:${bucketOpen?'var(--paper)':'transparent'};" onclick="toggleAgingBucket('${key}','${b.key}')">
              <span style="color:var(--text-soft); font-weight:600;">${b.label}</span>
              <span class="mono" style="color:var(--azure); font-weight:700;">${state.currency}${fmt(amount)}</span>
            </div>
            ${bucketOpen?`
            <div style="padding:0 16px 14px; background:var(--paper);">
              ${bucketRows.length===0?'<div class="empty">Nothing in this range</div>':
              `<table><thead><tr><th>${partyLabel}</th><th>Entry</th><th>Invoice Date</th><th>Due Date</th><th class="num">Days Overdue</th><th class="num">Amount</th></tr></thead><tbody>
              ${bucketRows.map(r=>`<tr style="cursor:pointer;" onclick="goToEntryDetail('${r.entryId}')"><td>${r.partyName}</td><td class="mono">${r.entryId}</td><td>${r.date}</td><td>${r.dueDate}</td><td class="num">${r.daysOverdue}</td><td class="num">${state.currency}${fmt(r.remaining)}</td></tr>`).join('')}
              </tbody></table>`}
            </div>`:''}
          </div>`;
        }).join('')}
      </div>`:''}
      ${aging.total===0?'<div class="hint" style="margin-top:10px;">Nothing unpaid right now.</div>':''}
    </div>
  </div>`;
}
function toggleAgingCurrent(key){
  const opening = !agingCurrentOpen[key];
  agingCurrentOpen[key] = opening;
  if(opening){ agingOverdueOpen[key] = false; agingOpenBucket[key] = null; }
  render();
}
function toggleAgingOverdue(key){
  const opening = !agingOverdueOpen[key];
  agingOverdueOpen[key] = opening;
  if(opening){ agingCurrentOpen[key] = false; } else { agingOpenBucket[key] = null; }
  render();
}
function toggleAgingBucket(key, bucketKey){
  agingOpenBucket[key] = agingOpenBucket[key]===bucketKey ? null : bucketKey;
  render();
}
function setCurrency(v){ state.currency = v || '$'; saveState(); render(); }

function sourceBadge(source){
  const map = {manual:['manual','Manual'], sale:['sale','Sale'], purchase:['purchase','Purchase'], receipt:['receipt','Receipt'], payment:['payment','Payment'], reversal:['reversal','Reversal']};
  const [cls,label] = map[source]||['manual',source];
  return `<span class="badge ${cls}">${label}</span>`;
}

let accountEditingCode = null;

      ${state.accounts.map(a=>{
        const t = accountTotals(a.code);
        const normal = ['asset','expense'].includes(a.type) ? t.debit-t.credit : t.credit-t.debit;
        if(accountEditingCode===a.code){
          return `<tr>
            <td>${a.system?`<span class="mono">${a.code}</span>`:`<input id="acc-edit-code-${a.code}" class="mono" style="width:80px;" value="${a.code}">`}</td>
            <td><input id="acc-edit-name-${a.code}" value="${a.name}"></td>
            <td>${a.system?`<span class="badge ${a.type}">${typeLabel(a.type)}</span>`:`
              <select id="acc-edit-type-${a.code}">
                <option value="asset" ${a.type==='asset'?'selected':''}>Asset</option>
                <option value="liability" ${a.type==='liability'?'selected':''}>Liability</option>
                <option value="equity" ${a.type==='equity'?'selected':''}>Equity</option>
                <option value="revenue" ${a.type==='revenue'?'selected':''}>Revenue</option>
                <option value="expense" ${a.type==='expense'?'selected':''}>Expense</option>
              </select>`}
            </td>
            <td class="num">${fmt(t.debit)}</td><td class="num">${fmt(t.credit)}</td><td class="num">${fmt(normal)}</td>
            <td style="white-space:nowrap;"><button class="small" onclick="saveEditedAccount('${a.code}')">Save</button> <button class="small secondary" onclick="cancelEditAccount()">Cancel</button></td>
          </tr>`;
        }
        return `<tr><td class="mono">${a.code}</td><td>${a.name}</td><td><span class="badge ${a.type}">${typeLabel(a.type)}</span></td>
        <td class="num">${fmt(t.debit)}</td><td class="num">${fmt(t.credit)}</td><td class="num">${fmt(normal)}</td>
        <td style="white-space:nowrap;"><button class="small secondary" onclick="startEditAccount('${a.code}')">Edit</button> ${a.system?'':`<button class="small danger" onclick="deleteAccount('${a.code}')">Delete</button>`}</td></tr>`;
      }).join('')}
      </tbody></table>
      ${state.accounts.some(a=>!a.system)?'<div class="hint" style="margin-top:8px;">Built-in accounts (used across the app\'s calculations) can only have their name changed — custom accounts can also have their code and type edited, as long as nothing has been posted against them yet.</div>':''}
    </div>
  `;
}
function sortAccounts(){
  state.accounts.sort((x,y)=> x.code.localeCompare(y.code, undefined, {numeric:true}));
}
function renderAccountsInPlace(){ document.getElementById('view').innerHTML = renderAccounts(); }
function startEditAccount(code){ accountEditingCode = code; renderAccountsInPlace(); }
function cancelEditAccount(){ accountEditingCode = null; renderAccountsInPlace(); }
function saveEditedAccount(oldCode){
  const a = accountByCode(oldCode);
  if(!a) return;
  const name = document.getElementById('acc-edit-name-'+oldCode).value.trim();
  if(!name){ toast('Account name cannot be empty'); return; }
  if(!a.system){
    const codeEl = document.getElementById('acc-edit-code-'+oldCode);
    const newCode = codeEl ? codeEl.value.trim() : oldCode;
    if(!newCode){ toast('Account code cannot be empty'); return; }
    if(newCode !== oldCode){
      if(accountByCode(newCode)){ toast('This account code is already in use'); return; }
      const used = state.journal.some(e=>e.lines.some(l=>l.code===oldCode));
      if(used){ toast('Cannot change the code of an account that has posted transactions'); return; }
      a.code = newCode;
    }
    const typeEl = document.getElementById('acc-edit-type-'+oldCode);
    if(typeEl) a.type = typeEl.value;
  }
  a.name = name;
  sortAccounts();
  accountEditingCode = null;
  saveState(); toast('Account updated'); render();
}
function exportAccountsExcel(){
  const rows = [['Code','Name','Type','Debit','Credit','Balance']];
  state.accounts.forEach(a=>{
    const t = accountTotals(a.code);
    const normal = ['asset','expense'].includes(a.type) ? t.debit-t.credit : t.credit-t.debit;
    rows.push([a.code, a.name, typeLabel(a.type), t.debit, t.credit, normal]);
  });
  exportRowsToExcel(rows, 'Chart of Accounts', 'chart-of-accounts-'+todayISO()+'.xlsx');
}
function addAccount(){
  const code = document.getElementById('acc-code').value.trim();
  const name = document.getElementById('acc-name').value.trim();
  const type = document.getElementById('acc-type').value;
  if(!code || !name){ toast('Please enter both an account code and name'); return; }
  if(accountByCode(code)){ toast('This account code is already in use'); return; }
  state.accounts.push({code,name,type,system:false});
  sortAccounts();
  showNewAccountForm = false;
  saveState(); toast('Account added'); render();
}
function deleteAccount(code){
  const used = state.journal.some(e=>e.lines.some(l=>l.code===code));
  if(used){ toast('Cannot delete an account that has posted transactions'); return; }
  state.accounts = state.accounts.filter(a=>a.code!==code);
  saveState(); render();
}

let showNewCurrencyForm = false;
let currencyEditingCode = null;
function renderCurrencies(){
  return `
    <div class="topbar">
      <div><h2>Currencies</h2><div class="sub">Currencies available in this workspace and their exchange rate</div></div>
      <button onclick="toggleNewCurrencyForm()">${showNewCurrencyForm?'Cancel':'+ New'}</button>

    <div class="card">
      <table><thead><tr><th>Currency</th><th>Symbol</th><th>Name</th><th>Last Update</th><th class="num">Current Rate</th><th>Active</th><th></th></tr></thead><tbody>
      ${state.currencies.map(c=>{
        const isCompany = state.companyCurrencyCode===c.code;
        if(currencyEditingCode===c.code){
          return `<tr>
            <td class="mono" style="color:var(--debit); font-weight:700;">${c.code}</td>
            <td><input id="cur-edit-symbol-${c.code}" value="${c.symbol}"></td>
            <td><input id="cur-edit-name-${c.code}" value="${c.name}"></td>
            <td>${c.lastUpdate||'—'}</td>
            <td class="num"><input id="cur-edit-rate-${c.code}" type="number" min="0" step="0.000001" style="width:110px; text-align:right;" value="${c.rate}"></td>
            <td><button class="toggle-switch ${c.active?'on':''}" onclick="toggleCurrencyActive('${c.code}')"></button></td>
            <td style="white-space:nowrap;"><button class="small" onclick="saveEditedCurrency('${c.code}')">Save</button> <button class="small secondary" onclick="cancelEditCurrency()">Cancel</button></td>
          </tr>`;
        }
        return `<tr>
          <td class="mono" style="color:var(--debit); font-weight:700;">${c.code}${isCompany?' <span class="badge sale" title="Company currency — used for all amounts shown across the app">★ Company</span>':''}</td>
          <td>${c.symbol}</td>
          <td style="color:var(--azure);">${c.name}</td>
          <td>${c.lastUpdate||'—'}</td>
          <td class="num">${Number(c.rate).toFixed(6)}</td>
          <td><button class="toggle-switch ${c.active?'on':''}" onclick="toggleCurrencyActive('${c.code}')"></button></td>
          <td style="white-space:nowrap;">
            <button class="small secondary" onclick="startEditCurrency('${c.code}')">Edit</button>
            ${isCompany?'':`<button class="small secondary" onclick="setCompanyCurrency('${c.code}')">Set as Company Currency</button>`}
            ${isCompany?'':`<button class="small danger" onclick="deleteCurrency('${c.code}')">Delete</button>`}
          </td>
        </tr>`;
      }).join('')}
      </tbody></table>
      <div class="hint" style="margin-top:10px;">The row marked ★ Company is the currency symbol used for every amount shown across the app. Pick a different row's "Set as Company Currency" to switch.</div>
    </div>
  `;
}
function renderCurrenciesInPlace(){ document.getElementById('view').innerHTML = renderCurrencies(); }
function toggleNewCurrencyForm(){ showNewCurrencyForm = !showNewCurrencyForm; render(); }
function addCurrency(){
  const code = document.getElementById('cur-code').value.trim().toUpperCase();
  const symbol = document.getElementById('cur-symbol').value.trim();
  const name = document.getElementById('cur-name').value.trim();
  const rate = Number(document.getElementById('cur-rate').value)||1;
  if(!code || !symbol || !name){ toast('Please fill in the currency code, symbol and name'); return; }
  if(state.currencies.some(c=>c.code===code)){ toast('This currency code already exists'); return; }
  state.currencies.push({code, symbol, name, rate, active:true, lastUpdate:todayISO()});
  showNewCurrencyForm = false;
  saveState(); toast('Currency added'); render();
}
function startEditCurrency(code){ currencyEditingCode = code; renderCurrenciesInPlace(); }
function cancelEditCurrency(){ currencyEditingCode = null; renderCurrenciesInPlace(); }
function saveEditedCurrency(code){
  const c = state.currencies.find(x=>x.code===code);
  if(!c) return;
  const symbol = document.getElementById('cur-edit-symbol-'+code).value.trim();
  const name = document.getElementById('cur-edit-name-'+code).value.trim();
  const rate = Number(document.getElementById('cur-edit-rate-'+code).value)||0;
  if(!symbol || !name){ toast('Symbol and name cannot be empty'); return; }
  const rateChanged = rate !== c.rate;
  c.symbol = symbol; c.name = name; c.rate = rate;
  if(rateChanged) c.lastUpdate = todayISO();
  currencyEditingCode = null;
  // keep the app's display symbol in sync if this is the active company currency
  if(state.companyCurrencyCode===code) state.currency = symbol;
  saveState(); toast('Currency updated'); render();
}
function toggleCurrencyActive(code){
  const c = state.currencies.find(x=>x.code===code);
  if(!c) return;
  if(state.companyCurrencyCode===code && c.active){ toast('Cannot deactivate the company currency'); return; }
  c.active = !c.active;
  saveState(); render();
}
function setCompanyCurrency(code){
  const c = state.currencies.find(x=>x.code===code);
  if(!c) return;
  if(!c.active){ toast('Activate this currency before making it the company currency'); return; }
  state.companyCurrencyCode = code;
  state.currency = c.symbol;
  saveState(); toast(c.name+' is now the company currency'); render();
}
function deleteCurrency(code){
  if(state.companyCurrencyCode===code){ toast('Cannot delete the company currency'); return; }
  state.currencies = state.currencies.filter(c=>c.code!==code);
  saveState(); toast('Currency deleted'); render();
}

}
function renderJournalInPlace(){ document.getElementById('view').innerHTML = renderJournal(); }
/* Same lightweight in-place pattern as the Sales/Purchase line items: typing in
   Debit or Credit only patches that line's other (mutually-exclusive) field plus
   the running totals/balance status/Post button — no full rebuild, so the Date
   field and whichever input you're typing in are never disturbed. */
function updateJeLine(i, field, value){
  if(field==='debit'){
    manualLines[i].debit = value;
    manualLines[i].credit = '';
    const creditEl = document.getElementById('je-credit-'+i);
    if(creditEl) creditEl.value = '';
  } else {
    manualLines[i].credit = value;
    manualLines[i].debit = '';
    const debitEl = document.getElementById('je-debit-'+i);
    if(debitEl) debitEl.value = '';
  }
  updateJeTotals();
}
function updateJeTotals(){
  const totalD = manualLines.reduce((s,l)=>s+(Number(l.debit)||0),0);
  const totalC = manualLines.reduce((s,l)=>s+(Number(l.credit)||0),0);
  const balanced = manualLines.length>=2 && totalD>0 && Math.round(totalD*100)===Math.round(totalC*100);
  const debitEl = document.getElementById('je-total-debit');
  if(debitEl) debitEl.textContent = fmt(totalD);
  const creditEl = document.getElementById('je-total-credit');
  if(creditEl) creditEl.textContent = fmt(totalC);
  const balEl = document.getElementById('je-balance-status');
  if(balEl){ balEl.textContent = balanced?'✓ Balanced':'Not balanced'; balEl.className = balanced?'balanced':'unbalanced'; }
  const postBtn = document.getElementById('je-post-btn');
  if(postBtn) postBtn.disabled = !balanced;
}
function addJeLine(){ manualLines.push({code:'',debit:'',credit:''}); renderJournalInPlace(); }
function removeJeLine(i){ manualLines.splice(i,1); renderJournalInPlace(); }
function submitManualEntry(){
  const date = jeDate || todayISO();
  const desc = document.getElementById('je-desc').value.trim() || 'Manual entry';
  const lines = manualLines.filter(l=>l.code && (Number(l.debit)>0 || Number(l.credit)>0));
  if(lines.length<2){ toast('You must enter at least two lines'); return; }
  try{
    postEntry(date, desc, 'manual', lines, manualJournalId);
    manualLines = [{code:'',debit:'',credit:''},{code:'',debit:'',credit:''}];
    jeDate = todayISO();
    saveState(); toast('Entry posted successfully'); render();
  }catch(err){ toast(err.message); }
}
function renderJeCard(e){
  return `<div class="journal-entry">
    <div class="je-head">

    </div>

function partyName(type,id){
  const list = type==='customer'?state.customers:state.suppliers;

}
function reverseEntry(id){
  const e = state.journal.find(x=>x.id===id);
  if(!e || e.reversed) return;
  const revLines = e.lines.map(l=>({code:l.code, debit:l.credit, credit:l.debit, partyType:l.partyType, partyId:l.partyId}));

function toggleProductFields(){

function addProduct(){
  const name = document.getElementById('p-name').value.trim();
  const kind = document.getElementById('p-kind').value;
  const qty = Number(document.getElementById('p-qty').value)||0;
  const cost = Number(document.getElementById('p-cost').value)||0;
  const price = Number(document.getElementById('p-price').value)||0;
  if(!name){ toast('Please enter an item name'); return; }
  const p = {id: uid('P','product'), name, kind, qty: kind==='product'?qty:0, cost: kind==='product'?cost:0, price, openingEntryId:null};
  state.products.push(p);
  if(kind==='product' && qty>0 && cost>0){
    const entry = postEntry(todayISO(), 'Opening inventory balance: '+name, 'manual', [
      {code:'1200', debit:qty*cost, credit:0},
      {code:'3000', debit:0, credit:qty*cost}
    ]);
    p.openingEntryId = entry.id;
  }
  saveState(); toast('Item added'); render();
}
/* Whether this item has ever appeared on a posted sale or purchase — once it
   has, quantity/cost come from those transactions and are no longer freely
   editable (editing them here could silently desync the Inventory GL balance). */
function productHasActivity(id){
  return state.sales.some(s=>s.items.some(it=>it.productId===id)) ||
         state.purchases.some(p=>p.items.some(it=>it.productId===id));
}
function startEditProduct(id){ productEditingId = id; renderInventoryInPlace(); }
function cancelEditProduct(){ productEditingId = null; renderInventoryInPlace(); }
function saveEditedProduct(id){
  const p = state.products.find(x=>x.id===id);
  if(!p) return;
  const name = document.getElementById('p-edit-name-'+id).value.trim();
  if(!name){ toast('Item name cannot be empty'); return; }
  const price = Number(document.getElementById('p-edit-price-'+id).value)||0;
  p.name = name; p.price = price;
  if(p.kind==='product' && !productHasActivity(id)){
    const qtyEl = document.getElementById('p-edit-qty-'+id);
    const costEl = document.getElementById('p-edit-cost-'+id);
    const qty = qtyEl ? (Number(qtyEl.value)||0) : p.qty;
    const cost = costEl ? (Number(costEl.value)||0) : p.cost;
    // re-post the opening-balance entry so the Inventory account stays in sync
    if(p.openingEntryId){ state.journal = state.journal.filter(e=>e.id!==p.openingEntryId); p.openingEntryId = null; }
    p.qty = qty; p.cost = cost;
    if(qty>0 && cost>0){
      const entry = postEntry(todayISO(), 'Opening inventory balance: '+p.name, 'manual', [
        {code:'1200', debit:qty*cost, credit:0},
        {code:'3000', debit:0, credit:qty*cost}
      ]);
      p.openingEntryId = entry.id;
    }
  }
  productEditingId = null;
  saveState(); toast('Item updated'); render();
}
function deleteProduct(id){
  if(productHasActivity(id)){ toast('Cannot delete an item that has been used in a posted sale or purchase'); return; }
  const p = state.products.find(x=>x.id===id);
  if(p && p.openingEntryId){ state.journal = state.journal.filter(e=>e.id!==p.openingEntryId); }
  state.products = state.products.filter(x=>x.id!==id);
  saveState(); toast('Item deleted'); render();
}

  });
  exportRowsToExcel(rows, 'Inventory', 'inventory-'+todayISO()+'.xlsx');
}

function renderSales(){

/* Updates just this line's total and the grand total in place, without rebuilding
   the whole form — so typing in Qty/Price doesn't reset focus, the on-screen
   number keyboard, or the Date/Due date fields (which used to snap back to
   today because a full re-render always redrew them from scratch). */
function updateSaleLineTotal(i){
  const it = saleItems[i];
  const lineEl = document.getElementById('sale-line-total-'+i);
  if(lineEl) lineEl.value = fmt((it.qty||0)*(it.price||0));

function selectSaleProduct(i,pid){

function removeSaleItem(i){ saleItems.splice(i,1); renderSalesInPlace(); }
function saleTotal(){ return saleItems.reduce((s,it)=>s+(it.qty||0)*(it.price||0),0); }

/* Posts the journal entries + stock effect for a sale record's *current* items.
   Used both when first posting an invoice and when re-applying it after an edit —
   always call reverseSaleEffect() first if the record was already posted before. */
function applySaleRecord(s){
  let productRevenue=0, serviceRevenue=0, cogs=0;
  s.items.forEach(it=>{
    const prod = state.products.find(p=>p.id===it.productId);
    if(!prod) return;
    const lineTotal = it.qty*it.price;
    if(prod.kind==='product'){ productRevenue+=lineTotal; cogs += it.qty*prod.cost; }
    else{ serviceRevenue+=lineTotal; }
  });
  const total = productRevenue+serviceRevenue;
  const lines = [];
  if(s.payment==='cash'){ lines.push({code:'1000', debit:total, credit:0}); }
  else{ lines.push({code:'1100', debit:total, credit:0, partyType:'customer', partyId:s.customerId}); }
  if(productRevenue>0) lines.push({code:'4000', debit:0, credit:productRevenue});
  if(serviceRevenue>0) lines.push({code:'4100', debit:0, credit:serviceRevenue});
  const custLabel = s.payment==='credit' ? (state.customers.find(c=>c.id===s.customerId)||{}).name : 'Cash customer';
  const entry = postEntry(s.date, 'Sales invoice — '+custLabel, 'sale', lines);
  if(s.payment==='credit') entry.dueDate = s.dueDate;
  const entryIds = [entry.id];
  if(cogs>0){
    const cogsEntry = postEntry(s.date, 'Cost of goods sold — '+entry.id, 'sale', [
      {code:'5000', debit:cogs, credit:0}, {code:'1200', debit:0, credit:cogs}
    ]);
    entryIds.push(cogsEntry.id);
  }
  s.items.forEach(it=>{
    const prod = state.products.find(p=>p.id===it.productId);
    if(prod && prod.kind==='product') prod.qty -= it.qty;
  });
  s.entryIds = entryIds;
}
/* Undoes a previously-applied sale record: restores the stock it took out and
   removes the journal entries it posted. Sales never touch weighted-average cost
   (only purchases do), so this reversal is always exact. */
function reverseSaleEffect(s){
  s.items.forEach(it=>{
    const prod = state.products.find(p=>p.id===it.productId);
    if(prod && prod.kind==='product') prod.qty += it.qty;
  });
  state.journal = state.journal.filter(e=>!s.entryIds.includes(e.id));
}
function submitSale(){
  const date = saleDate || todayISO();
  const items = saleItems.filter(it=>it.productId && it.qty>0);
  if(items.length===0){ toast('Add at least one item'); return; }
  if(salePayment==='credit' && !saleCustomer){ toast('Please select a customer for a credit sale'); return; }
  for(const it of items){
    const prod = state.products.find(p=>p.id===it.productId);
    if(prod.kind==='product' && it.qty>prod.qty){ toast(`Not enough stock of "${prod.name}"`); return; }
  }
  const dueDate = salePayment==='credit' ? (saleDueDate || addDays(date,30)) : null;
  const record = {
    id: uid('INV','sale'), date, dueDate, payment: salePayment,
    customerId: salePayment==='credit' ? saleCustomer : null,
    items: items.map(it=>({productId:it.productId, qty:it.qty, price:it.price})),
    entryIds: []
  };
  applySaleRecord(record);
  state.sales.push(record);
  saleItems = [{productId:'',qty:1,price:0}]; salePayment='cash'; saleCustomer='';
  saleDate = todayISO(); saleDueDate = addDays(todayISO(),30);
  saveState(); toast('Sales invoice posted ('+record.id+')'); render();
}

function startEditSale(id){
  const s = state.sales.find(x=>x.id===id);
  if(!s) return;
  salesEditingId = id;
  saleEditDraft = JSON.parse(JSON.stringify(s.items));
  renderSalesInPlace();
}
function cancelEditSale(){ salesEditingId=null; saleEditDraft=null; renderSalesInPlace(); }
/* When editingProductSelect is falsy (Qty/Price typing) we only patch the two total
   display fields in place, the same lightweight way updateSaleLineTotal() does for
   the new-invoice form — so typing a number doesn't rebuild the whole form. Picking
   a different item from the dropdown still does a full re-render (needed to refresh
   the Line total field's disabled state etc.), which is fine since that's a single
   discrete click, not continuous typing. */
function editSaleDraftField(idx, field, value, liveOnly){
  saleEditDraft[idx][field] = field==='productId' ? value : Number(value)||0;
  if(liveOnly){
    const it = saleEditDraft[idx];
    const lineEl = document.getElementById('sale-edit-line-total-'+idx);
    if(lineEl) lineEl.value = fmt((it.qty||0)*(it.price||0));
    const grandEl = document.getElementById('sale-edit-grand-total');
    if(grandEl) grandEl.textContent = fmt(saleEditDraft.reduce((s2,x)=>s2+(x.qty||0)*(x.price||0),0));
    return;
  }
  renderSalesInPlace();
}
function removeSaleDraftItem(idx){ saleEditDraft.splice(idx,1); renderSalesInPlace(); }
function addSaleDraftItem(){ saleEditDraft.push({productId:'', qty:1, price:0}); renderSalesInPlace(); }
function saveEditedSale(id){
  const s = state.sales.find(x=>x.id===id);
  if(!s) return;
  const newItems = (saleEditDraft||[]).filter(it=>it.productId && it.qty>0);
  reverseSaleEffect(s); // temporarily restore stock/undo entries so we can validate against true availability
  for(const it of newItems){
    const prod = state.products.find(p=>p.id===it.productId);
    if(prod && prod.kind==='product' && it.qty>prod.qty){
      toast(`Not enough stock of "${prod.name}"`);
      applySaleRecord(s); // roll back — reapply with the original (unchanged) items
      return;
    }
  }
  if(newItems.length===0){
    state.sales = state.sales.filter(x=>x.id!==id);
    salesEditingId=null; saleEditDraft=null;
    saveState(); toast('Sales invoice deleted'); render();
    return;
  }
  s.items = newItems;
  applySaleRecord(s);
  salesEditingId=null; saleEditDraft=null;
  saveState(); toast('Sales invoice updated'); render();
}
function deleteSaleInvoice(id){
  const s = state.sales.find(x=>x.id===id);
  if(!s) return;
  if(!confirm('Delete this sales invoice? This restores the stock it took out and removes its journal entries.')) return;
  reverseSaleEffect(s);
  state.sales = state.sales.filter(x=>x.id!==id);
  if(salesEditingId===id){ salesEditingId=null; saleEditDraft=null; }
  saveState(); toast('Sales invoice deleted'); render();
}

/* Same lightweight, non-rebuilding update as updateSaleLineTotal() — keeps typing
   in Qty/Unit cost from resetting focus or the Date/Due date fields. */
function updatePurchaseLineTotal(i){
  const it = purchaseItems[i];
  const lineEl = document.getElementById('purchase-line-total-'+i);
  if(lineEl) lineEl.value = fmt((it.qty||0)*(it.cost||0));
  const grandEl = document.getElementById('purchase-grand-total');
  if(grandEl) grandEl.textContent = fmt(purchaseTotal());
}
function selectPurchaseProduct(i,pid){
  purchaseItems[i].productId = pid;
  const prod = state.products.find(p=>p.id===pid);
  if(prod) purchaseItems[i].cost = prod.cost;
  renderPurchaseInPlace();

function removePurchaseItem(i){ purchaseItems.splice(i,1); renderPurchaseInPlace(); }
function purchaseTotal(){ return purchaseItems.reduce((s,it)=>s+(it.qty||0)*(it.cost||0),0); }

/* Posts the journal entries + weighted-average inventory effect for a purchase
   record's *current* items. Used both when first posting and when re-applying
   after an edit — always call reversePurchaseEffect() first if it was posted before. */
function applyPurchaseRecord(p){
  const total = p.items.reduce((s,it)=>s+it.qty*it.cost,0);
  const lines = [{code:'1200', debit:total, credit:0}];
  if(p.payment==='cash') lines.push({code:'1000', debit:0, credit:total});
  else lines.push({code:'2000', debit:0, credit:total, partyType:'supplier', partyId:p.supplierId});
  const supLabel = p.payment==='credit' ? (state.suppliers.find(s=>s.id===p.supplierId)||{}).name : 'Cash supplier';
  const entry = postEntry(p.date, 'Purchase invoice — '+supLabel, 'purchase', lines);
  if(p.payment==='credit') entry.dueDate = p.dueDate;
  p.entryIds = [entry.id];
  p.items.forEach(it=>{
    const prod = state.products.find(pp=>pp.id===it.productId);
    if(!prod) return;
    const newQty = prod.qty + it.qty;
    prod.cost = newQty>0 ? ((prod.qty*prod.cost)+(it.qty*it.cost))/newQty : it.cost; // weighted average
    prod.qty = newQty;
  });
}
/* Undoes a previously-applied purchase record: removes its journal entries and
   reverses the weighted-average cost update it made — the exact mathematical
   inverse of applyPurchaseRecord's update (exact if this was the most recent
   purchase affecting the product; a close approximation otherwise, same as any
   moving-average costing system without full per-lot tracking). */
function reversePurchaseEffect(p){
  state.journal = state.journal.filter(e=>!p.entryIds.includes(e.id));
  p.items.forEach(it=>{
    const prod = state.products.find(pp=>pp.id===it.productId);
    if(!prod || prod.kind!=='product') return;
    const beforeQty = prod.qty - it.qty;
    prod.cost = beforeQty>0.0001 ? ((prod.qty*prod.cost)-(it.qty*it.cost))/beforeQty : 0;
    prod.qty = beforeQty;
  });
}
function submitPurchase(){
  const date = purchaseDate || todayISO();
  const items = purchaseItems.filter(it=>it.productId && it.qty>0);
  if(items.length===0){ toast('Add at least one item'); return; }
  if(purchasePayment==='credit' && !purchaseSupplier){ toast('Please select a supplier for a credit purchase'); return; }
  const dueDate = purchasePayment==='credit' ? (purchaseDueDate || addDays(date,30)) : null;
  const record = {
    id: uid('BILL','purchase'), date, dueDate, payment: purchasePayment,
    supplierId: purchasePayment==='credit' ? purchaseSupplier : null,
    items: items.map(it=>({productId:it.productId, qty:it.qty, cost:it.cost})),
    entryIds: []
  };
  applyPurchaseRecord(record);
  state.purchases.push(record);
  purchaseItems=[{productId:'',qty:1,cost:0}]; purchasePayment='cash'; purchaseSupplier='';
  purchaseDate = todayISO(); purchaseDueDate = addDays(todayISO(),30);
  saveState(); toast('Purchase invoice posted ('+record.id+')'); render();
}

   deleting them afterwards would leave dangling references, so it's blocked. */

/* ============================= TRIAL BALANCE ============================= */
function renderTrial(){
  let totalD=0, totalC=0;
  const rows = state.accounts.map(a=>{
    const t = accountTotals(a.code);
    const normal = ['asset','expense'].includes(a.type) ? t.debit-t.credit : t.credit-t.debit;
    const debitCol = normal>=0 && ['asset','expense'].includes(a.type) ? normal : (normal<0 && !['asset','expense'].includes(a.type) ? -normal : 0);
    const creditCol = normal>=0 && !['asset','expense'].includes(a.type) ? normal : (normal<0 && ['asset','expense'].includes(a.type) ? -normal : 0);
    totalD += debitCol; totalC += creditCol;
    return {a, debitCol, creditCol};
  }).filter(r=>r.debitCol!==0 || r.creditCol!==0);
  const balanced = Math.round(totalD*100)===Math.round(totalC*100);
  return `
    <div class="topbar"><div><h2>Trial Balance</h2><div class="sub">Total debit and credit balances across all accounts</div></div></div>
    <div class="card">
      <table><thead><tr><th>Code</th><th>Account name</th><th>Type</th><th class="num">Debit</th><th class="num">Credit</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td class="mono">${r.a.code}</td><td>${r.a.name}</td><td><span class="badge ${r.a.type}">${typeLabel(r.a.type)}</span></td>
      <td class="num">${r.debitCol?fmt(r.debitCol):''}</td><td class="num">${r.creditCol?fmt(r.creditCol):''}</td></tr>`).join('')}
      </tbody>
      <tfoot><tr style="font-weight:800; border-top:2px solid var(--ink);">
        <td colspan="3">Total</td><td class="num">${fmt(totalD)}</td><td class="num">${fmt(totalC)}</td>
      </tr></tfoot>
      </table>
      <div class="total-line"><span class="${balanced?'balanced':'unbalanced'}">${balanced?'✓ Trial balance is balanced':'⚠ Not balanced — review your entries'}</span></div>
    </div>
  `;
}

function balanceSheetData(){
  const groups = {asset:[], liability:[], equity:[]};
  state.accounts.forEach(a=>{
    if(!groups[a.type]) return;
    const t = accountTotals(a.code);
    const balance = a.type==='asset' ? t.debit-t.credit : t.credit-t.debit;
    if(balance!==0) groups[a.type].push({account:a, balance});
  });
  const totalAssets = groups.asset.reduce((s,r)=>s+r.balance,0);
  const totalLiabilities = groups.liability.reduce((s,r)=>s+r.balance,0);
  const equityAccounts = groups.equity.reduce((s,r)=>s+r.balance,0);
  const currentEarnings = netProfit();
  const totalEquity = equityAccounts + currentEarnings;
  return {groups, totalAssets, totalLiabilities, totalEquity, currentEarnings};
}
function bsRows(rows){
  if(rows.length===0) return '<div class="empty">No activity</div>';
  return `<table><tbody>${rows.map(r=>`<tr><td>${r.account.code} — ${r.account.name}</td><td class="num">${state.currency}${fmt(r.balance)}</td></tr>`).join('')}</tbody></table>`;
}

function profitLossData(){
  const revenueRows = [], cogsRows = [], expenseRows = [];
  state.accounts.forEach(a=>{
    const t = accountTotals(a.code);
    if(a.type==='revenue'){
      const bal = t.credit-t.debit;
      if(bal!==0) revenueRows.push({account:a, balance:bal});
    } else if(a.type==='expense'){
      const bal = t.debit-t.credit;
      if(bal===0) return;
      if(a.code==='5000') cogsRows.push({account:a, balance:bal});
      else expenseRows.push({account:a, balance:bal});
    }
  });
  const totalRevenue = revenueRows.reduce((s,r)=>s+r.balance,0);
  const totalCogs = cogsRows.reduce((s,r)=>s+r.balance,0);
  const grossProfit = totalRevenue - totalCogs;
  const totalExpense = expenseRows.reduce((s,r)=>s+r.balance,0);
  const netIncome = grossProfit - totalExpense;
  return {revenueRows, cogsRows, expenseRows, totalRevenue, totalCogs, grossProfit, totalExpense, netIncome};
}

  const d = profitLossData();
  return `
    <div class="topbar"><div><h2>Profit and Loss</h2><div class="sub">Income statement — all-time activity</div></div></div>
    <div class="card">
      <h3>Revenue</h3>

  `;
}

function cashFlowLabelForSource(source){
  const map = {
    receipt: 'Cash received from customers',
    payment: 'Cash paid to suppliers',
    sale: 'Cash sales',
    purchase: 'Cash purchases',
    manual: 'Other manual cash movements',
    reversal: 'Reversed cash entries',
  };
  return map[source] || 'Other cash movements';
}
function cashFlowData(){
  const byLabel = {};
  let net = 0;
  state.journal.forEach(e=>{
    e.lines.forEach(l=>{
      if(l.code!=='1000') return;
      const amt = l.debit - l.credit;
      if(amt===0) return;
      const label = cashFlowLabelForSource(e.source);
      byLabel[label] = (byLabel[label]||0) + amt;
      net += amt;
    });
  });
  return {rows: Object.entries(byLabel).map(([label,amount])=>({label,amount})), net};
}

function generalLedgerAccountLines(code, type){
  const rows = [];

  rows.sort((a,b)=> a.date===b.date ? String(a.id).localeCompare(b.id) : a.date.localeCompare(b.date));
