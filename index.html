  return parties.map(p=>{
    const buckets = {current:0,b1:0,b2:0,b3:0,b4:0};
    invoicesForParty(type, p.id).forEach(inv=>{ buckets[agingBucket(inv.dueDate)] += inv.remaining; });
    const total = Object.values(buckets).reduce((s,v)=>s+v,0);
    return {party:p, buckets, total};
  }).filter(r=>r.total>0.004);
}
function renderAgedReport(type, title, parties){
  const rows = agedPartyRows(type, parties);
  const totals = rows.reduce((acc,r)=>{
    acc.current+=r.buckets.current; acc.b1+=r.buckets.b1; acc.b2+=r.buckets.b2; acc.b3+=r.buckets.b3; acc.b4+=r.buckets.b4; acc.total+=r.total;
    return acc;
  }, {current:0,b1:0,b2:0,b3:0,b4:0,total:0});
  return `
    <div class="topbar"><div><h2>${title}</h2><div class="sub">Outstanding balances by age, as of ${todayISO()}</div></div></div>
    <div class="card">
      ${rows.length===0?'<div class="empty">Nothing outstanding right now</div>':
      `<table><thead><tr><th>${type==='customer'?'Customer':'Supplier'}</th><th class="num">Current</th><th class="num">1–30 days</th><th class="num">31–60 days</th><th class="num">61–90 days</th><th class="num">Above 90</th><th class="num">Total</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td>${r.party.name}</td><td class="num">${fmt(r.buckets.current)}</td><td class="num">${fmt(r.buckets.b1)}</td><td class="num">${fmt(r.buckets.b2)}</td><td class="num">${fmt(r.buckets.b3)}</td><td class="num">${fmt(r.buckets.b4)}</td><td class="num">${fmt(r.total)}</td></tr>`).join('')}
      </tbody>
      <tfoot><tr style="font-weight:800; border-top:2px solid var(--ink);">
        <td>Total</td><td class="num">${fmt(totals.current)}</td><td class="num">${fmt(totals.b1)}</td><td class="num">${fmt(totals.b2)}</td><td class="num">${fmt(totals.b3)}</td><td class="num">${fmt(totals.b4)}</td><td class="num">${fmt(totals.total)}</td>
      </tr></tfoot>
      </table>`}
    </div>
  `;
}
function renderAgedReceivable(){ return renderAgedReport('customer', 'Aged Receivable', state.customers); }
function renderAgedPayable(){ return renderAgedReport('supplier', 'Aged Payable', state.suppliers); }

/* ============================= BACKUP / EXPORT ============================= */
/* ============================= USERS ============================= */
let showNewUserForm = false;
function toggleNewUserForm(){ showNewUserForm = !showNewUserForm; render(); }
function generateTempPassword(){
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
  let pass = '';
  for(let i=0;i<10;i++) pass += chars[Math.floor(Math.random()*chars.length)];
  return pass;
}
let userEditingId = null;
function renderUsers(){
  return `
    <div class="topbar">
      <div><h2>Users</h2><div class="sub">People who can access this workspace</div></div>
      <div style="display:flex; gap:8px;">
        <button class="secondary" onclick="exportUsersExcel()">⬇ Export Excel</button>
        <button onclick="toggleNewUserForm()">${showNewUserForm?'Cancel':'+ New'}</button>
      </div>
    </div>
    ${showNewUserForm?`
    <div class="card">
      <h3>Invite a new user</h3>
      <div class="row">
        <div class="field"><label>Name</label><input id="user-name" placeholder="e.g. Sara Ahmed"></div>
        <div class="field"><label>Email Address</label><input id="user-email" type="email" placeholder="e.g. sara@company.com"></div>
        <div class="field"><label>Access rights</label>
          <select id="user-role"><option value="User">User</option><option value="Administrator">Administrator</option></select>
        </div>
        <div class="field" style="display:flex; align-items:flex-end;"><button onclick="addUser()">Send invite</button></div>
      </div>
      <div class="hint" style="margin-top:8px;">A temporary password will be emailed to them — this is simulated in this demo; no real email is sent.</div>
    </div>`:''}
    <div class="card">
      <h3>Users (${state.users.length})</h3>
      ${state.users.length===0?'<div class="empty">No users yet — invite one to get started</div>':
      `<table><thead><tr><th>Name</th><th>Email Address</th><th>Latest Authentication</th><th>Status</th><th>Access Rights</th><th></th></tr></thead><tbody>
      ${state.users.map(u=>{
        if(userEditingId===u.id){
          return `<tr>
            <td><input id="user-edit-name-${u.id}" value="${u.name}"></td>
            <td><input id="user-edit-email-${u.id}" type="email" class="mono" value="${u.email}"></td>
            <td>${u.lastAuth || 'Never'}</td>
            <td><span class="badge ${u.status==='Confirmed'?'sale':'purchase'}">${u.status}</span></td>
            <td>
              <select id="user-edit-role-${u.id}">
                <option value="User" ${u.role==='User'?'selected':''}>User</option>
                <option value="Administrator" ${u.role==='Administrator'?'selected':''}>Administrator</option>
              </select>
            </td>
            <td style="white-space:nowrap;"><button class="small" onclick="saveEditedUser('${u.id}')">Save</button> <button class="small secondary" onclick="cancelEditUser()">Cancel</button></td>
          </tr>`;
        }
        return `<tr><td>${u.name}</td><td class="mono">${u.email}</td><td>${u.lastAuth || 'Never'}</td>
      <td><span class="badge ${u.status==='Confirmed'?'sale':'purchase'}">${u.status}</span></td>
      <td>${u.role}</td>
      <td style="white-space:nowrap;"><button class="small secondary" onclick="startEditUser('${u.id}')">Edit</button>
      <button class="small secondary" onclick="resetUserPassword('${u.id}')">Reset Password</button>
      <button class="small danger" onclick="deleteUser('${u.id}')">Delete</button></td></tr>`;
      }).join('')}
      </tbody></table>`}
    </div>
  `;
}
function renderUsersInPlace(){ document.getElementById('view').innerHTML = renderUsers(); }
function addUser(){
  const name = document.getElementById('user-name').value.trim();
  const email = document.getElementById('user-email').value.trim();
  const role = document.getElementById('user-role').value;
  if(!name || !email){ toast('Please enter both a name and an email address'); return; }
  if(state.users.some(u=>u.email.toLowerCase()===email.toLowerCase())){ toast('A user with this email already exists'); return; }
  generateTempPassword(); // a real backend would email this; this demo has none to send it from
  state.users.push({id: uid('U','user'), name, email, role, status:'Pending', lastAuth:null});
  showNewUserForm = false;
  saveState();
  toast(`Invite sent to ${email} with a temporary password (simulated — no real email is sent from this demo)`);
  render();
}
function startEditUser(id){ userEditingId = id; renderUsersInPlace(); }
function cancelEditUser(){ userEditingId = null; renderUsersInPlace(); }
function saveEditedUser(id){
  const u = state.users.find(x=>x.id===id);
  if(!u) return;
  const name = document.getElementById('user-edit-name-'+id).value.trim();
  const email = document.getElementById('user-edit-email-'+id).value.trim();
  if(!name || !email){ toast('Please enter both a name and an email address'); return; }
  if(state.users.some(x=>x.id!==id && x.email.toLowerCase()===email.toLowerCase())){ toast('A user with this email already exists'); return; }
  u.name = name; u.email = email;
  u.role = document.getElementById('user-edit-role-'+id).value;
  userEditingId = null;
  saveState(); toast('User updated'); render();
}
function resetUserPassword(id){
  const u = state.users.find(x=>x.id===id);
  if(!u) return;
  generateTempPassword();
  toast(`New password emailed to ${u.email} (simulated — no real email is sent from this demo)`);
}
function deleteUser(id){
  state.users = state.users.filter(u=>u.id!==id);
  saveState(); render();
}
function exportUsersExcel(){
  const rows = [['Name','Email Address','Latest Authentication','Status','Access Rights']];
  state.users.forEach(u=> rows.push([u.name, u.email, u.lastAuth||'Never', u.status, u.role]));
  exportRowsToExcel(rows, 'Users', 'users-'+todayISO()+'.xlsx');
}

function renderBackup(){
  return `
    <div class="topbar"><div><h2>Settings</h2><div class="sub">Keep a copy of your data, or restore it later</div></div></div>
    <div class="banner">Data auto-saves to this browser's local storage on this device. It stays put across visits as long as you keep using the same browser on this same device and don't clear its site data. It won't follow you to another browser, another device, or private/incognito mode — download a backup file below if you need that.</div>
    <div class="grid g2">
      <div class="card">
        <h3>Full backup (JSON)</h3>
        <p class="hint" style="margin-bottom:14px;">Downloads a file with everything (accounts, journal, inventory, customers, suppliers) so you can restore it on any device or browser.</p>
        <button onclick="exportJSON()">⬇ Download backup</button>
        <div style="margin-top:18px; padding-top:16px; border-top:1px dashed var(--line);">
          <label>Restore from backup</label>
          <input type="file" id="import-file" accept=".json" onchange="importJSONFile(this)">
          <div class="hint">⚠ Importing will completely replace all current data.</div>
        </div>
      </div>
      <div class="card">
        <h3>Export to Excel</h3>
        <p class="hint" style="margin-bottom:14px;">Creates an Excel file with several sheets: trial balance, journal, customers, suppliers, inventory — good for sharing or printing.</p>
        <button onclick="exportExcel()">⬇ Download Excel file</button>
      </div>
    </div>
  `;
}

function exportJSON(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'ledger-backup-' + todayISO() + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Backup downloaded');
}

function importJSONFile(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const imported = JSON.parse(e.target.result);
      if(!imported.accounts || !imported.journal){ throw new Error('This file is not a valid backup'); }
      state = imported;
      saveState();
      toast('Backup restored successfully');
      goTo('dashboard');
    }catch(err){
      toast('Could not read file: ' + err.message);
    }
    input.value = '';
  };
  reader.readAsText(file);
}

function exportExcel(){
  if(typeof XLSX !== 'undefined'){ buildAndDownloadExcel(); return; }
  toast('Loading export tool...');
  const script = document.createElement('script');
  script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  script.onload = function(){ buildAndDownloadExcel(); };
  script.onerror = function(){ toast('Could not load the export tool — check your internet connection'); };
  document.head.appendChild(script);
}
/* Generic single-sheet exporter used by the "Export Excel" button on individual
   list pages (Chart of Accounts, Journals, Users, ...) — reuses the same
   lazy-loaded XLSX library as the full multi-sheet backup export below. */
function exportRowsToExcel(rows, sheetName, filename){
  if(typeof XLSX !== 'undefined'){ downloadExcelRows(rows, sheetName, filename); return; }
  toast('Loading export tool...');
  const script = document.createElement('script');
  script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  script.onload = function(){ downloadExcelRows(rows, sheetName, filename); };
  script.onerror = function(){ toast('Could not load the export tool — check your internet connection'); };
  document.head.appendChild(script);
}
function downloadExcelRows(rows, sheetName, filename){
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), sheetName);
  XLSX.writeFile(wb, filename);
  toast('Excel file downloaded');
}

function buildAndDownloadExcel(){
  const wb = XLSX.utils.book_new();

  // Trial balance
  const tbRows = [['Code','Account Name','Type','Debit','Credit']];
  let totalD=0, totalC=0;
  state.accounts.forEach(a=>{
    const t = accountTotals(a.code);
    const normal = ['asset','expense'].includes(a.type) ? t.debit-t.credit : t.credit-t.debit;
    const debitCol = normal>=0 && ['asset','expense'].includes(a.type) ? normal : (normal<0 && !['asset','expense'].includes(a.type) ? -normal : 0);
    const creditCol = normal>=0 && !['asset','expense'].includes(a.type) ? normal : (normal<0 && ['asset','expense'].includes(a.type) ? -normal : 0);
    if(debitCol||creditCol){ tbRows.push([a.code, a.name, typeLabel(a.type), debitCol||'', creditCol||'']); totalD+=debitCol; totalC+=creditCol; }
  });
  tbRows.push(['','Total','', totalD, totalC]);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(tbRows), 'Trial Balance');

  // Journal
  const jRows = [['Entry No.','Date','Description','Source','Account','Debit','Credit']];
  state.journal.forEach(e=>{
    e.lines.forEach(l=>{
      jRows.push([e.id, e.date, e.desc + (e.reversed?' (reversed)':''), e.source, l.code+' - '+((accountByCode(l.code)||{}).name||''), l.debit||'', l.credit||'']);
    });
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(jRows), 'Journal');

  // Customers
  const cRows = [['Name','Phone','Balance Due']];
  state.customers.forEach(c=> cRows.push([c.name, c.phone||'', partyBalance('customer',c.id)]));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(cRows), 'Customers');

  // Suppliers
  const sRows = [['Name','Phone','Balance Due']];
  state.suppliers.forEach(s=> sRows.push([s.name, s.phone||'', partyBalance('supplier',s.id)]));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sRows), 'Suppliers');

  // Inventory
  const pRows = [['Name','Type','Qty','Cost','Price','Inventory Value']];
  state.products.forEach(p=> pRows.push([p.name, p.kind==='product'?'Product':'Service', p.kind==='product'?p.qty:'', p.kind==='product'?p.cost:'', p.price, p.kind==='product'?p.qty*p.cost:'']));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(pRows), 'Inventory');

  // Chart of Accounts
  const acctRows = [['Code','Name','Type','Debit','Credit','Balance']];
  state.accounts.forEach(a=>{
    const t = accountTotals(a.code);
    const normal = ['asset','expense'].includes(a.type) ? t.debit-t.credit : t.credit-t.debit;
    acctRows.push([a.code, a.name, typeLabel(a.type), t.debit, t.credit, normal]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(acctRows), 'Chart of Accounts');

  // Journals (configuration)
  const jcRows = [['Name','Short Code','Type']];
  state.journalsConfig.forEach(j=> jcRows.push([j.name, j.code, journalTypeLabel(j.type)]));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(jcRows), 'Journals');

  // Users
  const uRows = [['Name','Email','Latest Authentication','Status','Access Rights']];
  state.users.forEach(u=> uRows.push([u.name, u.email, u.lastAuth||'Never', u.status, u.role]));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(uRows), 'Users');

  XLSX.writeFile(wb, 'accounting-report-' + todayISO() + '.xlsx');
  toast('Excel file downloaded');
}

/* ============================= INIT ============================= */
try{
  loadState();
}catch(err){
  showFatalError(err.stack || err.message);
}
